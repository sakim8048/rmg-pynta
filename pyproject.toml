[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rmgpynta"
version = "0.1.0"
description = "Orchestrator for a closed feedback loop between RMG and Pynta"
requires-python = ">=3.8"
dependencies = [
    "PyYAML>=5.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["rmgpynta*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
